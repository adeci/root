unbind C-b
set -g prefix C-Space
bind -N "Send the prefix key through to the application" C-Space send-prefix

set -g default-terminal tmux-256color
set -g display-panes-colour default
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
setw -g aggressive-resize on
setw -g clock-mode-style 24
set -s escape-time 0
set -g history-limit 50000
set -gq allow-passthrough on
set -g visual-activity off
set -g status-keys emacs
set -g mode-keys vi

# Terminal capabilities
set -ga terminal-features "*:hyperlinks"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#H"

# Window behavior
set -g renumber-windows on
set -g display-time 4000
set -g status-interval 5

# Environment forwarding on reattach
set -g update-environment 'DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY WINDOWID XAUTHORITY TERM TERM_PROGRAM'

# New panes re-read the current system's environment
set-environment -gu __NIX_DARWIN_SET_ENVIRONMENT_DONE
set-environment -gu __NIXOS_SET_ENVIRONMENT_DONE

# tmux-fingers (loaded by the wrapper after this file)
set -g @fingers-key f
set -g @fingers-enabled-builtin-patterns url

# Pane navigation: vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation: shift vim keys
bind H previous-window
bind L next-window

# Splits keep the working directory
bind - split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind v copy-mode
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind Tab switch-client -l
bind-key K confirm kill-window

# Copy and clear the selection without leaving copy mode
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Pane resize requires Ctrl+drag
unbind -n MouseDrag1Border
bind -n C-MouseDrag1Border resize-pane -M

# Tokyo Night status bar
set -g status-style bg=default
set -g status-left-length 90
set -g status-justify centre
set -gq status-left '#[fg=#1a1b26,bg=#9ece6a,bold] #S #[fg=#9ece6a,bg=default,nobold,nounderscore,noitalics]'
set -gq status-right ""
set -gq window-status-format '#[fg=#565f89,bg=default] #I  #W '
set -gq window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7,bold] #I  #W #[fg=#7aa2f7,bg=default,nobold]'
