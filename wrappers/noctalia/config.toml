# Settings changes override this from ~/.local/state/noctalia/settings.toml.

[shell]
polkit_agent = true
setup_wizard_enabled = false
# Apps opened from noctalia get their own unit, so restarting noctalia doesn't close them.
launch_apps_as_systemd_services = true

[theme]
builtin = "Tokyo-Night"

# Noctalia's defaults, pinned: nothing else locks the screen before suspend, lid close included.
[lockscreen]
enabled = true
lock_before_suspend = true

# Defining behaviors replaces noctalia's built-in ones, so these repeat their action and timeout.
[idle.behavior.lock]
action = "lock"
timeout = 600
enabled = false

[idle.behavior.screen-off]
action = "screen_off"
timeout = 660
enabled = false
