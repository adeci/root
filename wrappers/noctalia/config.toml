# Noctalia's base config. Changes made in Settings or with `noctalia msg` land in ~/.local/state/noctalia/settings.toml and override this file; copy what you want to keep here.

[shell]
polkit_agent = true
setup_wizard_enabled = false

# Noctalia's defaults, pinned: nothing else locks the screen before suspend, lid close included.
[lockscreen]
enabled = true
lock_before_suspend = true

# Defining behaviors replaces noctalia's built-in ones, so these repeat their action and timeout.
[idle.behavior.lock]
action = "lock"
timeout = 600
enabled = false

[idle.behavior.screen-off]
action = "screen_off"
timeout = 660
enabled = false
