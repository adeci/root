# launchd starts AeroSpace and borders (modules/aerospace/default.nix).
start-at-login = false
after-login-command = []
on-focus-changed = ["move-mouse window-lazy-center"]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 6
outer.bottom = 6
outer.top = 6
outer.right = 6

[mode.main.binding]
alt-enter = "exec-and-forget @KITTY_HOME@"
alt-shift-enter = "exec-and-forget @KITTY_HERE@"

alt-q = "close --quit-if-last-window"

alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion horizontal vertical"
alt-f = "fullscreen"
alt-v = "join-with down"
alt-b = "join-with right"

alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"

alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"
alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"

alt-ctrl-h = "focus-monitor left"
alt-ctrl-j = "focus-monitor down"
alt-ctrl-k = "focus-monitor up"
alt-ctrl-l = "focus-monitor right"

alt-shift-ctrl-h = "move-node-to-monitor --focus-follows-window left"
alt-shift-ctrl-j = "move-node-to-monitor --focus-follows-window down"
alt-shift-ctrl-k = "move-node-to-monitor --focus-follows-window up"
alt-shift-ctrl-l = "move-node-to-monitor --focus-follows-window right"

alt-shift-ctrl-u = "move-workspace-to-monitor --wrap-around next"

alt-t = "layout floating tiling"

alt-shift-r = "reload-config"

alt-shift-space = "layout tiles horizontal vertical"
